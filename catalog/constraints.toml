# Constraint registry: one table per constraint, keyed by its path under data/ (without .csv).
#
# The CSV header is the source of truth for description, references and units (see units.py);
# this file holds what the header cannot say:
#   category      oscillation | beta_decay | 0vbb | decay_in_flight | peak_search | fixed_target |
#                 collider | precision | low_energy | xray | supernovae | cosmology
#   label, style  defaults used on figures (figures.py can override per figure)
#   y_conversion  how a sin^2(2θ) / tan^2(θ) column becomes |U|^2: exact (default) | small_angle | none
#   computed      parameters of a computed curve (no CSV), e.g. 0vbb half-life limits


