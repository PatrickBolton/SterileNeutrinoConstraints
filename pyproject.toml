[project]
name = "sterile-constraints"
version = "0.1.0"
description = "Compilation of constraints on heavy neutral lepton / sterile neutrino mixing"
readme = "README.md"
license = "MIT"
authors = [{ name = "Patrick Bolton" }]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyterlab",
    "nbclient",
    "nbformat",
    "nbstripout",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sterile_constraints"]
